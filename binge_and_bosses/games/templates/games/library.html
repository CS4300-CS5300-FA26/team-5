{% extends "base.html" %}
{% block content %}
<head><title>{{ user.username }}'s Library</title></head>
  <h1>{{ user.username }}'s Library</h1>
  <p>Your games will show up here soon.</p>

  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Log out</button>
  </form>
{% endblock %}
