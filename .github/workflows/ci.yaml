name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-real-key
      DEBUG: "True"
      IGDB_CLIENT_ID: test-id
      IGDB_CLIENT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v5

      # Installs uv; `uv sync` below then installs the Python version in .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no major-version tag exists)
        with:
          version: "0.13.0"

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install packages
        run: uv sync --locked

      - name: Run tests with coverage
        working-directory: binge_and_bosses
        run: uv run --locked coverage run manage.py test

      # Acceptance tests from the stories' Gherkin (features/). --append adds
      # their coverage to the unit tests' so the 80% check counts both.
      - name: Run Behave scenarios with coverage
        working-directory: binge_and_bosses
        run: uv run --locked coverage run --append manage.py behave --simple

      - name: Enforce 80% coverage
        working-directory: binge_and_bosses
        run: uv run --locked coverage report -m --fail-under=80

      # Production installs only the non-dev packages. Check that
      # the app still starts that way, e.g. that settings.py doesn't need behave-django.
      # A separate environment keeps the dev packages in .venv for any later steps.
      - name: Check the app starts without dev packages
        working-directory: binge_and_bosses
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/no-dev-venv
        run: uv run --locked --no-dev python manage.py check

  # Ruff runs the PyLint (PL) and Flake8 (E, W, F, C90) rules set in pyproject.toml.
  # Findings appear as annotations on the PR's changed files, and the full
  # report is in the job summary and the ruff-report artifact.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no major-version tag exists)
        with:
          version: "0.13.0"

      - name: Install packages
        run: uv sync --locked

      - name: Write the Ruff report
        run: |
          {
            echo "## Ruff report"
            echo '```'
            uv run --locked ruff check --statistics --exit-zero .
            uv run --locked ruff check --output-format concise --exit-zero .
            echo '```'
          } | tee ruff-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ruff-report
          path: ruff-report.md

      # Fails the build on any finding.
      - name: Ruff check
        run: uv run --locked ruff check --output-format github .

  # Deploy only after CI passes on a push to main.
  deploy:
    name: Deploy to Heroku
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: heroku-production
      url: https://bingeandbosses.com
    concurrency:
      group: heroku-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Push the tested commit to Heroku
        id: push
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: binge-and-bosses-team5
        run: |
          set -euo pipefail
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::Set HEROKU_API_KEY in the heroku-production environment."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping stale deployment; main is now at ${latest_main}."
            exit 0
          fi

          askpass="$(mktemp "$RUNNER_TEMP/heroku-askpass.XXXXXX")"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *sername*) printf '%s\n' heroku ;;
            *) printf '%s\n' "$HEROKU_API_KEY" ;;
          esac
          EOF
          chmod 700 "$askpass"

          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= push \
            "https://git.heroku.com/${HEROKU_APP}.git" HEAD:main
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # Skipped when the push step skipped a stale deployment.
      - name: Smoke-test production
        if: steps.push.outputs.deployed == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP: binge-and-bosses-team5
          APP_URL: https://binge-and-bosses-team5-4e736711771e.herokuapp.com
          EXPECTED_SHA: ${{ github.sha }}
        run: .github/scripts/smoke-test-production.sh
