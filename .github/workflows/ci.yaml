name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-real-key
      DEBUG: "True"
      RAWG_API_KEY: test-key
    steps:
      - uses: actions/checkout@v5

      # Installs uv; `uv sync` below then installs the Python version in .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no major-version tag exists)
        with:
          version: "0.13.0"

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install packages
        run: uv sync --locked

      # Render installs from requirements.txt, so it must match uv.lock.
      - name: Check requirements.txt matches uv.lock
        run: |
          uv export --locked --no-dev --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt || {
            echo "::error file=requirements.txt::requirements.txt is out of date. Run: uv export --locked --no-dev --no-emit-project -o requirements.txt"
            exit 1
          }

      - name: Run tests with coverage
        working-directory: binge_and_bosses
        run: uv run --locked coverage run manage.py test

      # Acceptance tests from the stories' Gherkin (features/). --append adds
      # their coverage to the unit tests' so the 80% check counts both.
      - name: Run Behave scenarios with coverage
        working-directory: binge_and_bosses
        run: uv run --locked coverage run --append manage.py behave --simple

      - name: Enforce 80% coverage
        working-directory: binge_and_bosses
        run: uv run --locked coverage report -m --fail-under=80

      # Render installs only the non-dev packages (requirements.txt). Check that
      # the app still starts that way, e.g. that settings.py doesn't need behave-django.
      # A separate environment keeps the dev packages in .venv for any later steps.
      - name: Check the app starts without dev packages
        working-directory: binge_and_bosses
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/no-dev-venv
        run: uv run --locked --no-dev python manage.py check
  # Deploy to render on pull requests being accepted into main, not pushing; waits for CI checks to pass before
  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger deployment on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL repository secret to the Render service's deploy hook URL."
            exit 1
          fi
          # Deploy the commit that passed this workflow's tests.
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --request POST --get --data-urlencode "ref=${GITHUB_SHA}" \
            --output /dev/null \
            --url "$RENDER_DEPLOY_HOOK_URL"
          echo "Render accepted the deploy request for ${GITHUB_SHA}. Check Render for build and deployment status."
