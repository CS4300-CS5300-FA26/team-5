# Adds path labels using the PR's own configuration, including on this setup PR.
# Use pull_request: teammates work on branches here, which receive a write token.
# Fork PRs are skipped because their tokens are read-only; that is acceptable
# for this team's branch-based workflow. Do not use pull_request_target.
name: PR Labels

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
