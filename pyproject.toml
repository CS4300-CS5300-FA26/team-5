[project]
name = "binge-and-bosses"
version = "0.1.0"
description = "Backlog management and social platform for gamers (CS 4300/5300 Team 5)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "python-decouple>=3.8",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
]
